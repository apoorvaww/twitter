services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in the root .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in the root .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER in the root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in the root .env}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: apoorvaww/twitter-backend:latest
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: 4000
      DATABASE_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER in the root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in the root .env}"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the root .env}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: apoorvaww/twitter-worker:latest
    build:
      context: ./backend
      target: runtime
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER in the root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in the root .env}"
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: apoorvaww/twitter-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
