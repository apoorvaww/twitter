services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-twitter_db}"
      POSTGRES_USER: "${POSTGRES_USER:-twitter_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-twitter_user}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-twitter_db}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: twitter:api
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: 4000
      DATABASE_URL: "postgres://${POSTGRES_USER:-twitter_user}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-twitter_db}"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: "${JWT_SECRET:-supersecretjwtkey}"
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: twitter:api
    build:
      context: ./backend
      target: runtime
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-twitter_user}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-twitter_db}"
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: twitter:frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Monitoring: Prometheus
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: twitter-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Monitoring: Grafana
  grafana:
    image: grafana/grafana:10.4.2
    container_name: twitter-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Monitoring: Node Exporter
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: twitter-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
